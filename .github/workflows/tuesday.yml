name: tuesday-refresh-grade-receipts
on:
  schedule: [{cron: "0 11 * * 2"}]      # Tue 07:00 ET
  workflow_dispatch:
    inputs: {week: {description: "week just completed", required: true}}
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SEASON: 2026
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r automation/requirements.txt
      - name: resolve week
        run: echo "WEEK=${{ github.event.inputs.week || vars.CURRENT_WEEK }}" >> $GITHUB_ENV
      - name: refresh projections (nflverse)
        run: python make_projections.py   # repo root; optional once floors.py owns the data
      - name: grade last week's card
        run: python automation/pipeline/grade.py --season $SEASON --week $WEEK
      - name: draft receipts issue (markdown draft -> GitHub issue)
        run: python automation/newsletter/draft.py --kind receipts --season $SEASON --week $WEEK
      - name: bump week
        run: gh variable set CURRENT_WEEK --body "$((WEEK+1))"
        env: {GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}}
      - name: open GitHub issue with the draft (copy into Substack)
        env: {GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}}
        run: |
          SUBJ=$(cat automation/newsletter/drafts/LATEST_SUBJECT.txt)
          FILE="automation/newsletter/drafts/$(echo "$SUBJ" | tr 'A-Z ' 'a-z_').md"
          gh issue create --title "DRAFT: $SUBJ" --body-file "$FILE" --label newsletter
      - name: commit outputs
        run: |
          git config user.name edge-index-bot && git config user.email bot@edge-index.com
          git add projections.csv automation/receipts automation/newsletter/drafts && git commit -m "week $WEEK receipts" || true
          git push
