name: tuesday-refresh-grade-receipts

on:
  schedule:
    - cron: "0 11 * * 2"        # Tue 07:00 ET
  workflow_dispatch:
    inputs:
      week:
        description: "week to grade (blank = the week just completed, from the schedule)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:                   # shared with card.yml and refresh-odds.yml: they all commit to main
  group: data-main
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04            # pinned for the season; ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (test it in the offseason)
    env:
      SEASON: 2026
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0             # calib.py reads each Legs board's last pre-kickoff version from git history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r automation/requirements.txt
      - name: resolve week to grade from the nflverse schedule (a manual week input overrides)
        run: |
          W="${{ github.event.inputs.week }}"
          [ -z "$W" ] && W=$(python automation/pipeline/nfl_week.py --season "$SEASON" --mode graded)
          echo "WEEK=$W" >> "$GITHUB_ENV"; echo "grading week $W"
      - name: grade last week's card
        run: python automation/pipeline/grade.py --season "$SEASON" --week "$WEEK"
      - name: price check (report only) - holds, carded legs and the Legs board against their prices
        run: |
          python automation/pipeline/price_check.py --season "$SEASON" --through "$WEEK" --out "automation/receipts/price_check_${SEASON}.md"
          # research: probability-blend variants and shadow R4 floors, every week's slates rebuilt (in-sample; report only)
          python automation/pipeline/blend_study.py --season "$SEASON" --weeks "3-${WEEK}" --cards --out "automation/receipts/blend_study_${SEASON}.md" > /dev/null             && { echo; echo "---"; echo; cat "automation/receipts/blend_study_${SEASON}.md"; } >> "automation/receipts/price_check_${SEASON}.md"             || echo "::warning::blend study failed; price check posted without it"
          gh issue create --title "PRICE CHECK: ${SEASON} through week ${WEEK}" --body-file "automation/receipts/price_check_${SEASON}.md"
      - name: calib model for next week's shadow card (SHADOW ONLY, never the live card; a failure only warns)
        run: |
          python automation/pipeline/calib.py --fit --season "$SEASON" --week "$((WEEK + 1))"             || echo "::warning::calib fit failed; next week's calib shadow card will be skipped (the live card is unaffected)"
      - name: publish season record to site (NFL Record tab)
        run: |
          mkdir -p cfb-app/public/data
          cp "automation/receipts/record_${SEASON}.json" cfb-app/public/data/nfl_record.json
      - name: draft receipts issue
        run: python automation/newsletter/draft.py --kind receipts --season "$SEASON" --week "$WEEK"
      - name: open GitHub issue with the draft (copy into Substack)
        run: |
          SUBJ=$(cat automation/newsletter/drafts/LATEST_SUBJECT.txt)
          FILE="automation/newsletter/drafts/$(echo "$SUBJ" | tr 'A-Z ' 'a-z_').md"
          gh issue create --title "DRAFT: $SUBJ" --body-file "$FILE" --label newsletter
      - name: commit outputs
        run: |
          git config user.name edge-index-bot
          git config user.email bot@edge-index.com
          git add automation/receipts automation/newsletter/drafts cfb-app/public/data automation/models
          git commit -m "week $WEEK receipts" || true
          git push
