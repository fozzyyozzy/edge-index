name: card-build-and-draft

on:
  schedule:
    - cron: "7 13 * * 3"        # Wed 09:00 ET -> tnf
    - cron: "7 13 * * 5"        # Fri 09:00 ET -> sun
    - cron: "7 13 * * 1"        # Mon 09:00 ET -> mnf
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week (blank = from the schedule)"
        required: false
      slate:
        description: "tnf | sun | mnf"
        required: true

permissions:
  contents: write
  issues: write

concurrency:                   # shared with refresh-odds.yml and tuesday.yml: they all commit to main
  group: data-main
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SEASON: 2026
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r automation/requirements.txt
      - name: resolve week from the nflverse schedule (current; a manual week input overrides)
        run: |
          W="${{ github.event.inputs.week }}"
          [ -z "$W" ] && W=$(python automation/pipeline/nfl_week.py --season "$SEASON" --mode current)
          echo "WEEK=$W" >> "$GITHUB_ENV"; echo "week $W"
      - name: resolve slate from weekday
        run: |
          S="${{ github.event.inputs.slate }}"
          if [ -z "$S" ]; then
            case "$(TZ=America/New_York date +%u)" in 3) S=tnf ;; 5) S=sun ;; 1) S=mnf ;; esac   # ET weekday (a late run can pass midnight UTC)
          fi
          S=$(echo "$S" | tr 'A-Z' 'a-z')                     # "Tnf" -> "tnf"
          echo "SLATE=$S" >> "$GITHUB_ENV"
      - name: don't rebuild a published card on a late scheduled run (a manual run still rebuilds)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "automation/cards/card_${SEASON}_w${WEEK}_${SLATE}.json" ]; then
            echo "::notice::card_${SEASON}_w${WEEK}_${SLATE}.json is already published; this scheduled run stops here"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: fetch DK ladders (The Odds API) - falls back to pastes if no key
        if: env.SKIP != '1'
        run: |
          if [ -n "$ODDS_API_KEY" ]; then
            case "$SLATE" in tnf|mnf) DAYS=2 ;; *) DAYS=5 ;; esac
            python automation/pipeline/fetch_lines.py --season "$SEASON" --week "$WEEK" --days "$DAYS" --slate "$SLATE" --out automation/lines
          else
            test -d "automation/lines/raw/w${WEEK}" || { echo "::error::no ODDS_API_KEY and no pastes in automation/lines/raw/w${WEEK}/"; exit 1; }
            python automation/pipeline/parse_lines.py --season "$SEASON" --week "$WEEK"
          fi
      - name: floor scan
        if: env.SKIP != '1'
        run: python automation/pipeline/floors.py --season "$SEASON" --week "$WEEK" --slate "$SLATE" --lines "automation/lines/dk_${SEASON}_w${WEEK}_${SLATE}.csv"
      - name: grade every rung (Legs tab) — before the card, which takes each leg's grade from it
        if: env.SKIP != '1'
        run: python automation/pipeline/grade_legs.py --season "$SEASON" --week "$WEEK" --slate "$SLATE" --lines "automation/lines/dk_${SEASON}_w${WEEK}_${SLATE}.csv"
      - name: build card
        if: env.SKIP != '1'
        run: python automation/pipeline/build_card_json.py --season "$SEASON" --week "$WEEK" --slate "$SLATE"
      - name: matchups board (defense vs position)
        if: env.SKIP != '1'
        run: python automation/pipeline/matchups.py --season "$SEASON" --week "$WEEK"
      - name: usage for every graded player (Legs tab ladder row)
        if: env.SKIP != '1'
        run: python automation/pipeline/usage.py --season "$SEASON" --week "$WEEK"
      - name: card QA - every house rule and the availability snapshot (a failure publishes nothing)
        if: env.SKIP != '1'
        run: |
          if python automation/pipeline/card_qa.py --season "$SEASON" --week "$WEEK" --slate "$SLATE" --out "$RUNNER_TEMP/qa.md"; then
            echo "QA=pass" >> "$GITHUB_ENV"
          else
            echo "QA=fail" >> "$GITHUB_ENV"                  # a rule failed, or card_qa.py itself crashed
          fi
      - name: QA failed - open "CARD FAILED QA"; publish nothing (only the odds-usage ledger row is kept)
        if: env.SKIP != '1' && env.QA == 'fail'
        run: |
          {
            echo "Week $WEEK $SLATE card failed QA. Nothing was published: no site data, no newsletter draft, no card commit."
            echo
            if [ -s "$RUNNER_TEMP/qa.md" ]; then cat "$RUNNER_TEMP/qa.md"; else echo "card_qa.py crashed before writing a checklist; see the run log."; fi
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/qa_fail.md"
          gh issue create --title "CARD FAILED QA" --body-file "$RUNNER_TEMP/qa_fail.md"
          # the Odds API requests were spent either way: keep the weekly cap honest
          git config user.name edge-index-bot
          git config user.email bot@edge-index.com
          git add automation/lines/odds_usage.csv
          git commit -m "week $WEEK $SLATE odds usage (card failed QA, not published)" || true
          git push || { git pull --rebase && git push; }
          exit 1
      - name: publish to site
        if: env.SKIP != '1' && env.QA == 'pass'
        run: |
          mkdir -p cfb-app/public/data
          cp "automation/cards/matchups_${SEASON}_w${WEEK}.json" cfb-app/public/data/nfl_matchups.json
          cp "automation/cards/usage_${SEASON}_w${WEEK}.json" cfb-app/public/data/nfl_usage.json
          cp "automation/cards/card_${SEASON}_w${WEEK}_${SLATE}.json" "cfb-app/public/data/nfl_card_${SLATE}.json"
          cp "automation/cards/legs_${SEASON}_w${WEEK}_${SLATE}.json" "cfb-app/public/data/nfl_legs_${SLATE}.json"
          cp "automation/floors/floors_${SEASON}_w${WEEK}_${SLATE}.json" "cfb-app/public/data/nfl_floors_${SLATE}.json"
          # tickets published by hand outside the pipeline (Card tab shows them flagged); clear last week's if none
          if [ -f "automation/cards/handbuilt_${SEASON}_w${WEEK}_${SLATE}.json" ]; then
            cp "automation/cards/handbuilt_${SEASON}_w${WEEK}_${SLATE}.json" "cfb-app/public/data/nfl_handbuilt_${SLATE}.json"
          else
            rm -f "cfb-app/public/data/nfl_handbuilt_${SLATE}.json"
          fi
      - name: draft card issue
        if: env.SKIP != '1' && env.QA == 'pass'
        run: python automation/newsletter/draft.py --kind card --season "$SEASON" --week "$WEEK" --slate "$SLATE"
      - name: open GitHub issue with the draft (copy into Substack)
        if: env.SKIP != '1' && env.QA == 'pass'
        run: |
          SUBJ=$(cat automation/newsletter/drafts/LATEST_SUBJECT.txt)
          FILE="automation/newsletter/drafts/$(echo "$SUBJ" | tr 'A-Z ' 'a-z_').md"
          { cat "$FILE"; echo; echo; echo '---'; echo; cat "$RUNNER_TEMP/qa.md"; } > "$RUNNER_TEMP/draft_body.md"   # draft + QA checklist
          gh issue create --title "DRAFT: $SUBJ" --body-file "$RUNNER_TEMP/draft_body.md" --label newsletter
      - name: commit
        if: env.SKIP != '1' && env.QA == 'pass'
        run: |
          git config user.name edge-index-bot
          git config user.email bot@edge-index.com
          git add automation/cards automation/lines automation/floors automation/newsletter/drafts cfb-app/public/data
          git commit -m "week $WEEK $SLATE card" || true
          git push || { git pull --rebase && git push; }     # another job may have pushed while this ran
