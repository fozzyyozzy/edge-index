name: tests

# Pipeline test suite (automation/tests): every script imports, golden card rebuilds match their fixtures, house rules
# on made-up cards, settle/grade on fixed box scores. No network, no secrets.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r automation/requirements.txt pytest pyyaml
      - run: python -m pytest automation/tests -q
