name: tests

# Pipeline test suite (automation/tests): every script imports, golden card rebuilds match their fixtures, house rules
# on made-up cards, settle/grade on fixed box scores. No network, no secrets.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04            # pinned for the season; ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (test it in the offseason)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r automation/requirements.txt pytest pyyaml pytest-github-actions-annotate-failures
      - run: python -m pytest automation/tests -q -rf   # failures also post as run annotations (readable without signing in)
